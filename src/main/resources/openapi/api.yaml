openapi: 3.1.0
info:
  title: SpringTest API
  version: 1.0.0

paths:
  /users/{id}:
    get:
      summary: Get user by id
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      summary: Update user
      operationId: updateUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      summary: Delete user
      operationId: deleteUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  /users:
    post:
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /authors/{id}:
    get:
      summary: Get author by id
      operationId: getAuthorById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Author found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
    patch:
      summary: Update author
      operationId: updateAuthorById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequestUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
    delete:
      summary: Delete author
      operationId: deleteAuthorById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  /authors:
    post:
      summary: Create author
      operationId: createAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequestCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'

  /courses/{id}:
    get:
      summary: Get course by id
      operationId: getCourseById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
    patch:
      summary: Update course
      operationId: updateCourseById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequestUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'
    delete:
      summary: Delete course
      operationId: deleteCourseById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  /courses:
    post:
      summary: Create course
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequestCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResponse'

components:
  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        profile:
          $ref: '#/components/schemas/ProfileResponse'
    UserRequestCreate:
      type: object
      required:
        - username
      properties:
        username:
          type: string
        profile:
          $ref: '#/components/schemas/ProfileRequestCreate'
    UserRequestUpdate:
      type: object
      properties:
        username:
          type: string
        profile:
          $ref: '#/components/schemas/ProfileRequestUpdate'

    ProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bio:
          type: string
    ProfileRequestCreate:
      type: object
      required:
        - bio
      properties:
        bio:
          type: string
    ProfileRequestUpdate:
      type: object
      properties:
        bio:
          type: string

    AuthorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookResponse'
    AuthorRequestCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookRequestCreate'
    AuthorRequestUpdate:
      type: object
      properties:
        name:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookRequestUpdate'

    BookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
    BookRequestCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
    BookRequestUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string

    CourseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentResponse'
    CourseRequestCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentRequestCreate'
    CourseRequestUpdate:
      type: object
      properties:
        title:
          type: string
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentRequestUpdate'

    StudentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    StudentRequestCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    StudentRequestUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string