plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'

    id "org.openapi.generator" version "7.6.0"
}

group = 'spring.ru'
version = '0.0.1-SNAPSHOT'
description = 'SpringTest'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDir "$projectDir/src/generated/src/main/java"
        }
    }
}

tasks.register("generateCreateDto", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = file("src/main/resources/openapi/api.yaml").toURI().toString()
    outputDir = "$projectDir/src/generated"

    apiPackage = "spring.ru.springtest.api"
    modelPackage = "spring.ru.springtest.dto.create"

    globalProperties = [
            apis: "false",
            models: "UserCreateRequest," +
                    "ProfileCreateRequest," +
                    "AuthorCreateRequest," +
                    "BookCreateRequest," +
                    "CourseCreateRequest," +
                    "StudentCreateRequest"
    ]

    configOptions = [
            interfaceOnly: "true",
            useSpringBoot3: "true",
            useJakartaEe: 'true',
            useBeanValidation: "true"
    ]
}

tasks.register("generateUpdateDto", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = file("src/main/resources/openapi/api.yaml").toURI().toString()
    outputDir = "$projectDir/src/generated"

    apiPackage = "spring.ru.springtest.api"
    modelPackage = "spring.ru.springtest.dto.update"

    globalProperties = [
            apis: "false",
            models: "UserUpdateRequest," +
                    "ProfileUpdateRequest," +
                    "AuthorUpdateRequest," +
                    "BookUpdateRequest," +
                    "CourseUpdateRequest," +
                    "StudentUpdateRequest"
    ]

    configOptions = [
            interfaceOnly: "true",
            useSpringBoot3: "true",
            useJakartaEe: 'true',
            useBeanValidation: "true"
    ]
}

tasks.register("generateResponseDto", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = file("src/main/resources/openapi/api.yaml").toURI().toString()
    outputDir = "$projectDir/src/generated"

    apiPackage = "spring.ru.springtest.api"
    modelPackage = "spring.ru.springtest.dto.response"

    globalProperties = [
            apis: "false",
            models: "UserResponse," +
                    "ProfileResponse," +
                    "AuthorResponse," +
                    "BookResponse," +
                    "CourseResponse," +
                    "StudentResponse," +
                    "ErrorResponse," +
                    "GetUsers200Response," +
                    "GetAuthors200Response," +
                    "GetCourses200Response"
    ]

    configOptions = [
            interfaceOnly: "true",
            useSpringBoot3: "true",
            useJakartaEe: 'true',
            useBeanValidation: "true",
            useBuilder: "true"
    ]
}

tasks.register("generateApi", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = file("src/main/resources/openapi/api.yaml").toURI().toString()
    outputDir = "$projectDir/src/generated"

    importMappings = [
            "AuthorCreateRequest": "spring.ru.springtest.dto.create.AuthorCreateRequest",
            "AuthorUpdateRequest": "spring.ru.springtest.dto.update.AuthorUpdateRequest",
            "AuthorResponse": "spring.ru.springtest.dto.response.AuthorResponse",

            "BookCreateRequest": "spring.ru.springtest.dto.create.BookCreateRequest",
            "BookUpdateRequest": "spring.ru.springtest.dto.update.BookUpdateRequest",
            "BookResponse": "spring.ru.springtest.dto.response.BookResponse",

            "UserCreateRequest": "spring.ru.springtest.dto.create.UserCreateRequest",
            "UserUpdateRequest": "spring.ru.springtest.dto.update.UserUpdateRequest",
            "UserResponse": "spring.ru.springtest.dto.response.UserResponse",

            "CourseCreateRequest": "spring.ru.springtest.dto.create.CourseCreateRequest",
            "CourseUpdateRequest": "spring.ru.springtest.dto.update.CourseUpdateRequest",
            "CourseResponse": "spring.ru.springtest.dto.response.CourseResponse",

            "StudentCreateRequest": "spring.ru.springtest.dto.create.StudentCreateRequest",
            "StudentUpdateRequest": "spring.ru.springtest.dto.update.StudentUpdateRequest",
            "StudentResponse": "spring.ru.springtest.dto.response.StudentResponse",

            "ProfileCreateRequest": "spring.ru.springtest.dto.create.ProfileCreateRequest",
            "ProfileUpdateRequest": "spring.ru.springtest.dto.update.ProfileUpdateRequest",
            "ProfileResponse": "spring.ru.springtest.dto.response.ProfileResponse",

            "ErrorResponse": "spring.ru.springtest.dto.response.ErrorResponse",
            "GetUsers200Response": "spring.ru.springtest.dto.response.GetUsers200Response",
            "GetAuthors200Response": "spring.ru.springtest.dto.response.GetAuthors200Response",
            "GetCourses200Response": "spring.ru.springtest.dto.response.GetCourses200Response"
    ]

    apiPackage = "spring.ru.springtest.api"
    modelPackage = "spring.ru.springtest.dto"

    globalProperties = [
            apis: "",
            models: "false",
            supportingFiles: "ApiUtil.java"
    ]

    configOptions = [
            interfaceOnly: "true",
            useSpringBoot3: "true",
            useJakartaEe: 'true'
    ]
}

tasks.register("generateAllDto") {
    dependsOn(
            "generateCreateDto",
            "generateUpdateDto",
            "generateResponseDto",
            "generateApi"
    )
}

compileJava.dependsOn tasks.generateAllDto